name: CI

on:
  push:
    branches: [main, "chore/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        env:
          # Unit tests mock providers; keys are intentionally unset.
          HUGGINGFACE_API_KEY: ""
          GROQ_API_KEY: ""
        run: pytest -q
