[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basic-rag-with-fastapi"
version = "0.1.0"
description = "A FastAPI RAG service with document ingestion, Chroma retrieval, and streaming answers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "muhammad-a-dev" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-huggingface>=0.1.0",
  "langchain-text-splitters>=0.3.0",
  "chromadb>=0.5.0",
  "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]
eval = [
  "datasets>=2.20.0",
  "ragas>=0.2.0",
]

[tool.setuptools.packages.find]
include = ["api*", "rag*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
